[request]
method = "POST"
path = "/readyz"

[response]
status = 405

[response.headers]
allow = "GET"
content-security-policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
vary = "Origin"
